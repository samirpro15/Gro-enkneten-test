name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seite-veroeffentlichen
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken (neuester Stand)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
