name: Orte vorbereiten

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminradar-places
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Orte abrufen
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python fetch_places.py

      - name: Dateien committen (falls geändert)
        run: |
          git config user.name "terminradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add places-*.json
          git diff --staged --quiet && exit 0
          git commit -m "Orte aktualisieren [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i*5))
          done
          exit 1
