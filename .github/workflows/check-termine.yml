name: Terminradar prüfen

on:
  schedule:
    # Alle 15 Minuten. GitHub führt Cron-Jobs nicht exakt pünktlich aus,
    # bei viel Last auf GitHub-Seite kann es ein paar Minuten Verzug geben.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # erlaubt manuelles Starten über den "Actions"-Tab

permissions:
  contents: write

concurrency:
  group: terminradar-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Termine prüfen (alle Gemeinden)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_termine.py

      - name: Debug-HTML als Artefakt hochladen (nur zur Fehlersuche)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: status.json committen (falls geändert)
        run: |
          git config user.name "terminradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "Status aktualisieren [skip ci]"
          git push
